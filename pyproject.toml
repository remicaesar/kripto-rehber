[project]
name = "kripto-rehber"
version = "0.1.0"
description = "Turkish Crypto Compliance Obligation Graph — an MCP server that exposes a structured, navigable graph of 200+ regulatory obligations for cryptocurrency service providers in Turkey."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Emir Murat Sezer", email = "58623867+emirmuratsezer@users.noreply.github.com" }
]
requires-python = ">=3.12"
keywords = ["mcp", "crypto", "compliance", "turkey", "regulation", "graph", "kvhs", "spk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "fastmcp",
    "jsonschema",
]

[project.urls]
Repository = "https://github.com/remicaesar/kripto-rehber"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
kripto-rehber = "kripto_rehber.server:main"
